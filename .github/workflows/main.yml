
name: Mobile Price ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t mobile-price-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name mobile-price-container \
            -p 5000:5000 \
            mobile-price-ml:${{ github.sha }}

      - name: Wait for application health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          docker logs mobile-price-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"battery_power":1500,"blue":0,"clock_speed":2.0,"dual_sim":1,"fc":5,"four_g":1,"int_memory":32,"m_dep":0.5,"mobile_wt":150,"n_cores":4,"pc":10,"px_height":1000,"px_width":1500,"ram":2000,"sc_h":10,"sc_w":5,"talk_time":10,"three_g":1,"touch_screen":1,"wifi":1}' \
            http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/mobile-price-ml
          docker tag mobile-price-ml:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag mobile-price-ml:${{ github.sha }} $IMAGE:latest

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/mobile-price-ml
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Show Docker container logs
        if: always()
        run: docker logs mobile-price-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f mobile-price-container || true
